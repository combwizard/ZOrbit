name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. [Troubleshooting](https://zorbit.lol/docs/troubleshooting/) covers the common problems,
        if you have not looked there yet.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: zorbit
    attributes:
      label: ZOrbit version
      description: Shown at the top of Studio.
      placeholder: "0.20.0"
    validations:
      required: true
  - type: input
    id: zbrush
    attributes:
      label: ZBrush version
      placeholder: "2026.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Press **Copy report** on Studio's **Status** screen and paste it here. It holds the versions and the ends of
        the logs that fit your setup, with your Windows user name and folders hidden. Look it over and remove anything
        you would rather not share.

        If Studio does not start, paste the last lines of `app_stderr.log` and `studio.log` from
        `%LOCALAPPDATA%\ZOrbit` instead, and remove your Windows user name from the paths.
      render: text
  - type: dropdown
    id: install
    attributes:
      label: How did you install ZOrbit?
      options:
        - Installer
        - Portable zip
        - From source
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Does ZBrush run as administrator?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
