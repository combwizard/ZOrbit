name: Bug report
description: Something does not work the way the docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. [Troubleshooting](https://zorbit.lol/docs/troubleshooting/) covers the common problems,
        if you have not looked there yet.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: zorbit
    attributes:
      label: ZOrbit version
      description: Shown at the top of Studio.
      placeholder: "0.11.0"
    validations:
      required: true
  - type: input
    id: zbrush
    attributes:
      label: ZBrush version
      placeholder: "2026.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The last lines of the logs for the problem, from `%LOCALAPPDATA%\ZOrbit`. Studio's **Status** screen has a
        button that opens the folder. Which logs to send depends on your ZBrush version:

        - ZBrush 2026 and newer: `radiald.log` and `bridge.log`
        - ZBrush 2022 to 2025: `radiald.log`, `zscript_bridge.log`, `zscript_hotkey.log` and `zscript_launch.log`
        - A crash at start: `app_stderr.log`
        - Studio problems: `studio.log`
        - The browser: `popout.log`

        The logs contain file paths with your Windows user name; look them over and remove anything you would rather
        not share.
      render: text
  - type: dropdown
    id: install
    attributes:
      label: How did you install ZOrbit?
      options:
        - Installer
        - Portable zip
        - From source
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: Does ZBrush run as administrator?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
