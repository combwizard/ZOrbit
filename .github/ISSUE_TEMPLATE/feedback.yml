name: Idea or feedback
description: An idea, a wish, or a screen that was unclear or too busy.
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        One line is plenty. "I didn't get what this button does" helps as much as a crash report.

        Got an idea? It may be on the [roadmap](https://github.com/users/combwizard/projects/2) already. If it is,
        add a thumbs-up or a comment there.
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to say?
      description: Where in ZOrbit it is, and what you expected or would like instead.
    validations:
      required: true
