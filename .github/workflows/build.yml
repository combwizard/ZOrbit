name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tag pushes

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0   # tests/test_starters.py reads the history of default_menus.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the pinned packages
        shell: pwsh
        run: python -m pip install -r requirements-lock.txt

      - name: Run the tests
        shell: pwsh
        run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path zorbit\paths.py -Pattern '^VERSION\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $v in zorbit\paths.py"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
                   (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Build app, portable zip and installer
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Smoke test the built exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          foreach ($flag in '--check', '--selftest') {
            $name = $flag.TrimStart('-')
            $p = Start-Process dist\ZOrbit\ZOrbit.exe -ArgumentList $flag -Wait -PassThru `
                   -RedirectStandardOutput "$name.out" -RedirectStandardError "$name.err"
            Get-Content "$name.out", "$name.err"
            if ($p.ExitCode -ne 0) { throw "ZOrbit.exe $flag exited with $($p.ExitCode)" }
          }

      - name: Upgrade older installs with the built exe
        timeout-minutes: 10
        shell: pwsh
        run: python tools/upgrade_check.py dist\ZOrbit\ZOrbit.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ZOrbitSetup-${{ steps.ver.outputs.version }}
          path: packaging/Output/ZOrbitSetup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ZOrbit-${{ steps.ver.outputs.version }}-portable
          path: dist/ZOrbit-${{ steps.ver.outputs.version }}-portable.zip
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $hit = $lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1
          if (-not $hit) { throw "CHANGELOG.md has no '## [$v]' section" }
          $body = foreach ($l in $lines[$hit.LineNumber..($lines.Count - 1)]) {
            if ($l -match '^## \[' -or $l -match '^\[[^\]]+\]: ') { break }
            $l
          }
          $setup = "packaging\Output\ZOrbitSetup-$v.exe"
          $zip = "dist\ZOrbit-$v-portable.zip"
          $tick = [string][char]96
          $fence = $tick * 3
          # GitHub shows every newline of release notes as a line break, so the wrapped lines of a paragraph or a bullet
          # are joined into one, as Studio's What's new does (changelog.py). Headings, new bullets, blank lines and
          # anything inside a code fence stay as they are.
          $joined = [System.Collections.Generic.List[string]]::new()
          $inFence = $false
          foreach ($l in $body) {
            $isFence = $l.TrimStart().StartsWith($fence)
            $prev = if ($joined.Count) { $joined[$joined.Count - 1] } else { '' }
            $continues = -not $inFence -and -not $isFence -and $l.Trim() -and $prev.Trim() -and
              $prev -notmatch '^\s*#' -and -not $prev.TrimStart().StartsWith($fence) -and
              $l -notmatch '^\s*([-*+] |#|\d+\. |>|\|)'
            if ($continues) { $joined[$joined.Count - 1] = $prev.TrimEnd() + ' ' + $l.Trim() } else { $joined.Add($l) }
            if ($isFence) { $inFence = -not $inFence }
          }
          $body = $joined
          # Studio's Install update reads the "<sha256>  ZOrbitSetup-<v>.exe" line below (studio.py _setup_asset) and
          # checks it against GitHub's own digest of the file: keep the format.
          $head = @(
            "Download **ZOrbitSetup-$v.exe** and run it. $($tick)ZOrbit-$v-portable.zip$($tick) is the portable version (see the install page). SHA256:",
            "",
            $fence,
            "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  ZOrbitSetup-$v.exe",
            "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  ZOrbit-$v-portable.zip",
            $fence,
            ""
          )
          # A blog post with the slug zorbit-<version, dots as dashes> gets a link above the changelog section.
          $slug = "zorbit-" + $v.Replace(".", "-")
          $post = Get-ChildItem docs\blog\posts\*.md -ErrorAction SilentlyContinue |
            Where-Object { Select-String -Path $_.FullName -Pattern "^slug:\s*$([regex]::Escape($slug))\s*$" -Quiet }
          if ($post) { $head += @("More about this release on the blog: https://zorbit.lol/docs/blog/$slug/", "") }
          (($head + $body) -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Create or update the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $assets = "packaging\Output\ZOrbitSetup-$v.exe", "dist\ZOrbit-$v-portable.zip"
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            # The tag was pushed again (for example after a history rewrite): refresh files and notes.
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit "$env:GITHUB_REF_NAME" --notes-file release-notes.md --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "ZOrbit $v" `
              --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
