name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tag pushes

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path zorbit\paths.py -Pattern '^VERSION\s*=\s*"([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $v in zorbit\paths.py"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
                   (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
                   (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Build app, portable zip and installer
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ZOrbit\ZOrbit.exe -ArgumentList '--check' -Wait -PassThru `
                 -RedirectStandardOutput check.out -RedirectStandardError check.err
          Get-Content check.out, check.err
          if ($p.ExitCode -ne 0) { throw "ZOrbit.exe --check exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: ZOrbitSetup-${{ steps.ver.outputs.version }}
          path: packaging/Output/ZOrbitSetup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ZOrbit-${{ steps.ver.outputs.version }}-portable
          path: dist/ZOrbit-${{ steps.ver.outputs.version }}-portable.zip
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $hit = $lines | Select-String -Pattern "^## \[$([regex]::Escape($v))\]" | Select-Object -First 1
          if (-not $hit) { throw "CHANGELOG.md has no '## [$v]' section" }
          $body = foreach ($l in $lines[$hit.LineNumber..($lines.Count - 1)]) {
            if ($l -match '^## \[' -or $l -match '^\[[^\]]+\]: ') { break }
            $l
          }
          ($body -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Create or update the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $assets = "packaging\Output\ZOrbitSetup-$v.exe", "dist\ZOrbit-$v-portable.zip"
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            # The tag was pushed again (for example after a history rewrite): refresh files and notes.
            gh release upload "$env:GITHUB_REF_NAME" @assets --clobber --repo "$env:GITHUB_REPOSITORY"
            gh release edit "$env:GITHUB_REF_NAME" --notes-file release-notes.md --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "ZOrbit $v" `
              --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with exit code $LASTEXITCODE" }
